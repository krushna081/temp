<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#F5F1E8"/>
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#A4A58C" opacity="0.45"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="675" fill="url(#dots)"/>

  <!-- Chakra wheel -->
  <g transform="translate(820 337)">
    <circle r="150" fill="none" stroke="#174F50" stroke-width="10"/>
    <circle r="196" fill="none" stroke="#171B24" stroke-width="4"/>
    <circle r="110" fill="none" stroke="#171B24" stroke-width="4"/>
    <circle r="66" fill="#F5F1E8" stroke="#171B24" stroke-width="6"/>
    <g stroke="#171B24" stroke-width="4">
      <line x1="-150" y1="0" x2="-66" y2="0"/>
      <line x1="66" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="-150" x2="0" y2="-66"/>
      <line x1="0" y1="66" x2="0" y2="150"/>
      <line x1="-106" y1="-106" x2="-47" y2="-47"/>
      <line x1="47" y1="-47" x2="106" y2="-106"/>
      <line x1="-106" y1="106" x2="-47" y2="47"/>
      <line x1="47" y1="47" x2="106" y2="106"/>
    </g>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#171B24">10</text>
    <text x="0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174F50">AGENTS</text>
    <!-- orbiting nodes -->
    <g>
      <circle cx="173" cy="0" r="22" fill="#E65B36" stroke="#171B24" stroke-width="6"/>
      <circle cx="89.6" cy="149.1" r="16" fill="#174F50" stroke="#171B24" stroke-width="5"/>
      <circle cx="-89.6" cy="149.1" r="19" fill="#E65B36" stroke="#171B24" stroke-width="6"/>
      <circle cx="-173" cy="0" r="15" fill="#174F50" stroke="#171B24" stroke-width="5"/>
      <circle cx="-89.6" cy="-149.1" r="21" fill="#E65B36" stroke="#171B24" stroke-width="6"/>
      <circle cx="89.6" cy="-149.1" r="14" fill="#174F50" stroke="#171B24" stroke-width="5"/>
      <rect x="81" y="-148" width="18" height="18" transform="rotate(45 90 -139)" fill="#E65B36" stroke="#171B24" stroke-width="4"/>
      <rect x="-108" y="-146" width="18" height="18" transform="rotate(45 -99 -137)" fill="#171B24"/>
      <rect x="-92" y="138" width="18" height="18" transform="rotate(45 -83 147)" fill="#A4A58C" stroke="#171B24" stroke-width="4"/>
      <rect x="90" y="141" width="16" height="16" transform="rotate(45 98 149)" fill="#171B24"/>
    </g>
  </g>

  <!-- Caption block -->
  <g transform="translate(70 480)">
    <rect x="14" y="14" width="386" height="150" fill="#171B24"/>
    <rect x="0" y="0" width="386" height="150" fill="#F5F1E8" stroke="#171B24" stroke-width="6"/>
    <text x="28" y="72" font-family="Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1" fill="#171B24">CHAKRAVYUH</text>
    <text x="28" y="122" font-family="Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1" fill="#E65B36">AI</text>
    <text x="104" y="122" font-family="Courier New, monospace" font-size="16" letter-spacing="2" fill="#174F50">MULTI-AGENT OS</text>
  </g>
</svg>
