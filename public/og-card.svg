    <text x="0" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#174F50">AGENTS</text>
    <circle cx="148" cy="0" r="18" fill="#E65B36" stroke="#171B24" stroke-width="5"/>
    <circle cx="-148" cy="0" r="13" fill="#174F50" stroke="#171B24" stroke-width="4"/>
    <circle cx="0" cy="-148" r="15" fill="#E65B36" stroke="#171B24" stroke-width="5"/>
    <circle cx="0" cy="148" r="12" fill="#174F50" stroke="#171B24" stroke-width="4"/>
  </g>

  <!-- Name -->
  <text x="70" y="200" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" letter-spacing="2" fill="#171B24">KRUSHNA</text>
  <text x="70" y="308" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="900" letter-spacing="2" fill="#171B24">JADHAV<tspan fill="#E65B36">.</tspan></text>

