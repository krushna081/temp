    <g stroke="#171B24" stroke-width="4">
      <line x1="-128" y1="0" x2="-56" y2="0"/>
      <line x1="56" y1="0" x2="128" y2="0"/>
      <line x1="0" y1="-128" x2="0" y2="-56"/>
      <line x1="0" y1="56" x2="0" y2="128"/>
      <line x1="-90" y1="-90" x2="-40" y2="-40"/>
      <line x1="40" y1="-40" x2="90" y2="-90"/>
      <line x1="-90" y1="90" x2="-40" y2="40"/>
